<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Trading Records - Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
        }

        .search-bar {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-bar input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .date-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .date-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .account-section {
            margin-bottom: 30px;
        }

        .account-header {
            font-size: 1.5em;
            color: #764ba2;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-weight: 700;
        }

        .date-header {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            font-weight: 600;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .photo-item {
            position: relative;
            padding-bottom: 100%;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            background: #f5f5f5;
        }

        .photo-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .photo-item:hover img {
            transform: scale(1.1);
        }

        .photo-name {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
            text-align: center;
            word-break: break-word;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }

        .close:hover {
            color: #667eea;
        }

        .no-photos {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .no-photos h2 {
            color: #666;
            margin-bottom: 15px;
        }

        .no-photos p {
            color: #999;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Day Trading Records</h1>
            <p class="subtitle">Photo Archive & Gallery</p>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search by account, date, or filename...">
        </div>

        <div id="loading" class="loading">Loading photos...</div>
        <div id="gallery" class="gallery" style="display: none;"></div>
        <div id="noPhotos" class="no-photos" style="display: none;">
            <h2>No Photos Yet</h2>
            <p>Upload your first trading screenshots to get started!<br>
            Use the <code>add-photo.sh</code> script or upload directly to the <code>photos/</code> folder.</p>
        </div>
    </div>

    <div id="modal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        // Photo data will be loaded from photos.json
        async function loadPhotos() {
            const gallery = document.getElementById('gallery');
            const loading = document.getElementById('loading');
            const noPhotos = document.getElementById('noPhotos');
            
            try {
                // Fetch the photo index from photos.json
                const response = await fetch('photos.json');
                
                if (!response.ok) {
                    throw new Error('Photos index not found');
                }
                
                const photoData = await response.json();
                
                if (!photoData || photoData.length === 0) {
                    loading.style.display = 'none';
                    noPhotos.style.display = 'block';
                    return;
                }

                // Process each account
                for (const accountData of photoData) {
                    if (accountData.dates && accountData.dates.length > 0) {
                        // Create account section
                        const accountSection = document.createElement('div');
                        accountSection.className = 'account-section';
                        accountSection.dataset.account = accountData.account;
                        
                        const accountHeader = document.createElement('div');
                        accountHeader.className = 'account-header';
                        accountHeader.textContent = `📈 Account: ${accountData.account}`;
                        accountSection.appendChild(accountHeader);
                        
                        // Sort dates (newest first)
                        const sortedDates = accountData.dates.sort((a, b) => b.date.localeCompare(a.date));
                        
                        // Create date sections
                        for (const dateData of sortedDates) {
                            if (dateData.photos && dateData.photos.length > 0) {
                                createDateSection(accountSection, accountData.account, dateData.date, dateData.photos);
                            }
                        }
                        
                        gallery.appendChild(accountSection);
                    }
                }

                loading.style.display = 'none';
                gallery.style.display = 'block';
                
            } catch (error) {
                console.error('Error loading photos:', error);
                loading.style.display = 'none';
                noPhotos.style.display = 'block';
            }
        }

        function createDateSection(accountSection, account, date, photos) {
            const section = document.createElement('div');
            section.className = 'date-section';
            section.dataset.date = date;
            
            const header = document.createElement('div');
            header.className = 'date-header';
            header.textContent = formatDate(date);
            
            const photoGrid = document.createElement('div');
            photoGrid.className = 'photo-grid';
            
            photos.forEach(photoName => {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                
                const img = document.createElement('img');
                const photoPath = `photos/${account}/${date}/${photoName}`;
                img.src = photoPath;
                img.alt = photoName;
                img.loading = 'lazy';
                img.onclick = () => openModal(photoPath);
                
                photoItem.appendChild(img);
                
                const photoNameDiv = document.createElement('div');
                photoNameDiv.className = 'photo-name';
                photoNameDiv.textContent = photoName;
                
                const container = document.createElement('div');
                container.appendChild(photoItem);
                container.appendChild(photoNameDiv);
                
                photoGrid.appendChild(container);
            });
            
            section.appendChild(header);
            section.appendChild(photoGrid);
            accountSection.appendChild(section);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function openModal(src) {
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = 'block';
            modalImg.src = src;
        }

        // Close modal
        document.querySelector('.close').onclick = function() {
            document.getElementById('modal').style.display = 'none';
        }

        document.getElementById('modal').onclick = function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const accountSections = document.querySelectorAll('.account-section');
            
            accountSections.forEach(accountSection => {
                const accountId = accountSection.dataset.account.toLowerCase();
                const dateSections = accountSection.querySelectorAll('.date-section');
                let accountHasMatch = accountId.includes(searchTerm);
                
                dateSections.forEach(section => {
                    const date = section.dataset.date.toLowerCase();
                    const photos = section.querySelectorAll('.photo-name');
                    let hasMatch = date.includes(searchTerm) || accountHasMatch;
                    
                    photos.forEach(photo => {
                        if (photo.textContent.toLowerCase().includes(searchTerm)) {
                            hasMatch = true;
                        }
                    });
                    
                    section.style.display = hasMatch ? 'block' : 'none';
                    if (hasMatch) accountHasMatch = true;
                });
                
                accountSection.style.display = accountHasMatch ? 'block' : 'none';
            });
        });

        // Load photos on page load
        loadPhotos();
    </script>
</body>
</html>
