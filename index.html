<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Trading Records - Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
        }

        .search-bar {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-bar input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .date-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .date-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .date-header {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            font-weight: 600;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .photo-item {
            position: relative;
            padding-bottom: 100%;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            background: #f5f5f5;
        }

        .photo-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .photo-item:hover img {
            transform: scale(1.1);
        }

        .photo-name {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
            text-align: center;
            word-break: break-word;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }

        .close:hover {
            color: #667eea;
        }

        .no-photos {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .no-photos h2 {
            color: #666;
            margin-bottom: 15px;
        }

        .no-photos p {
            color: #999;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Day Trading Records</h1>
            <p class="subtitle">Photo Archive & Gallery</p>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search by date or filename...">
        </div>

        <div id="loading" class="loading">Loading photos...</div>
        <div id="gallery" class="gallery" style="display: none;"></div>
        <div id="noPhotos" class="no-photos" style="display: none;">
            <h2>No Photos Yet</h2>
            <p>Upload your first trading screenshots to get started!<br>
            Use the <code>add-photo.sh</code> script or upload directly to the <code>photos/</code> folder.</p>
        </div>
    </div>

    <div id="modal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        // Photo data will be loaded from the photos directory
        async function loadPhotos() {
            const gallery = document.getElementById('gallery');
            const loading = document.getElementById('loading');
            const noPhotos = document.getElementById('noPhotos');
            
            try {
                // Fetch the directory listing from GitHub API
                const repoPath = window.location.pathname.split('/')[1];
                const username = window.location.hostname.split('.')[0];
                
                // For GitHub Pages, we'll scan the photos directory
                // This is a simple implementation that works with the folder structure
                const response = await fetch(`https://api.github.com/repos/${username}/${repoPath}/contents/photos`);
                
                if (!response.ok) {
                    throw new Error('Photos directory not found');
                }
                
                const folders = await response.json();
                
                if (!folders || folders.length === 0) {
                    loading.style.display = 'none';
                    noPhotos.style.display = 'block';
                    return;
                }

                // Sort folders by date (newest first)
                folders.sort((a, b) => b.name.localeCompare(a.name));

                // Load photos from each date folder
                for (const folder of folders) {
                    if (folder.type === 'dir') {
                        const dateResponse = await fetch(folder.url);
                        const photos = await dateResponse.json();
                        
                        const imageFiles = photos.filter(file => 
                            /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
                        );

                        if (imageFiles.length > 0) {
                            createDateSection(folder.name, imageFiles);
                        }
                    }
                }

                loading.style.display = 'none';
                gallery.style.display = 'grid';
                
            } catch (error) {
                console.error('Error loading photos:', error);
                loading.style.display = 'none';
                noPhotos.style.display = 'block';
            }
        }

        function createDateSection(date, photos) {
            const gallery = document.getElementById('gallery');
            
            const section = document.createElement('div');
            section.className = 'date-section';
            section.dataset.date = date;
            
            const header = document.createElement('div');
            header.className = 'date-header';
            header.textContent = formatDate(date);
            
            const photoGrid = document.createElement('div');
            photoGrid.className = 'photo-grid';
            
            photos.forEach(photo => {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                
                const img = document.createElement('img');
                img.src = photo.download_url;
                img.alt = photo.name;
                img.loading = 'lazy';
                img.onclick = () => openModal(photo.download_url);
                
                photoItem.appendChild(img);
                
                const photoName = document.createElement('div');
                photoName.className = 'photo-name';
                photoName.textContent = photo.name;
                
                const container = document.createElement('div');
                container.appendChild(photoItem);
                container.appendChild(photoName);
                
                photoGrid.appendChild(container);
            });
            
            section.appendChild(header);
            section.appendChild(photoGrid);
            gallery.appendChild(section);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function openModal(src) {
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = 'block';
            modalImg.src = src;
        }

        // Close modal
        document.querySelector('.close').onclick = function() {
            document.getElementById('modal').style.display = 'none';
        }

        document.getElementById('modal').onclick = function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const sections = document.querySelectorAll('.date-section');
            
            sections.forEach(section => {
                const date = section.dataset.date.toLowerCase();
                const photos = section.querySelectorAll('.photo-name');
                let hasMatch = date.includes(searchTerm);
                
                photos.forEach(photo => {
                    if (photo.textContent.toLowerCase().includes(searchTerm)) {
                        hasMatch = true;
                    }
                });
                
                section.style.display = hasMatch ? 'block' : 'none';
            });
        });

        // Load photos on page load
        loadPhotos();
    </script>
</body>
</html>
